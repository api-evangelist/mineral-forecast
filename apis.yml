aid: mineral-forecast
name: Mineral Forecast
description: >-
  Mineral Forecast is a geosciences AI company (backed by Techstars) that helps
  mineral exploration and mining teams identify the best drilling targets. Its
  explainable-AI geoscientific platform ingests exploration data to accelerate
  prospecting and site targeting across base metals, ferrous and industrial
  metals, industrial minerals, precious metals, and rare earth elements.
  Products include an AI geosciences platform, AI targeting, AI geological
  explainability analytics, and a Geo-Insights Hub, positioned as a
  human-centered decision-support tool for experienced geologists worldwide.
  As of this enrichment pass Mineral Forecast operates a B2B product and
  marketing website with no public developer API, SDK, or documented API
  surface; engagement is via request-a-demo and sales.
